<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate Roblox GUI Editor</title>
<style>
body{margin:0;font-family:Arial,sans-serif;display:flex;height:100vh;background:#1e1e1e;color:#fff;overflow:hidden;}
#historyPanel{width:200px;background:#2c2c2c;padding:10px;overflow-y:auto;}
#historyPanel h3{margin-top:0;}
#historyPanel button{width:100%;margin-bottom:5px;padding:5px;background:#444;border:none;color:#fff;cursor:pointer;text-align:left;}
#historyPanel button:hover{background:#555;}
#mainPanel{flex:1;display:flex;flex-direction:column;}
#editorContainer{flex:1;display:flex;overflow:hidden;}
#rightPanel{flex:1;display:flex;flex-direction:column;padding:10px;overflow:hidden;}
#preview{flex:1;background:#111;position:relative;overflow:hidden;border:1px solid #333;}
#luaOutput{height:150px;background:#222;color:#0f0;padding:10px;font-family:monospace;overflow:auto;resize:none;}
button{padding:10px;margin-top:5px;background:#444;border:none;color:#fff;cursor:pointer;}
button:hover{background:#555;}
.gui-element{position:absolute;border:1px solid #888;padding:5px;cursor:move;background:#333;color:#fff;text-align:center;user-select:none;touch-action:none;}
.resize-handle{width:15px;height:15px;background:#f00;position:absolute;bottom:0;right:0;cursor:se-resize;z-index:10;touch-action:none;}
#scriptModal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:1000;color:#0f0;}
#scriptModal textarea{width:90%;height:80%;margin:5% auto;display:block;background:#222;color:#0f0;font-family:monospace;padding:10px;}
#scriptModal button.closeModal{position:absolute;top:10px;right:10px;background:red;padding:10px;border:none;color:#fff;cursor:pointer;}
#scriptModal button.saveModal{position:absolute;top:10px;right:70px;background:#444;padding:10px;border:none;color:#fff;cursor:pointer;}
#colorModal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:1000;color:#fff;display:flex;justify-content:center;align-items:center;flex-direction:column;}
#colorModal input[type=color]{width:200px;height:50px;}
#colorModal button{margin-top:10px;padding:10px;background:red;border:none;color:#fff;cursor:pointer;}
#propertyModal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:1001;color:#fff;display:flex;justify-content:center;align-items:center;flex-direction:column;}
#propertyModal label{margin-top:5px;}
#propertyModal input, #propertyModal select{margin-top:5px;width:200px;}
#propertyModal button{margin-top:10px;padding:10px;background:red;border:none;color:#fff;cursor:pointer;}
</style>
</head>
<body>
<div id="historyPanel">
<h3>History</h3>
<div id="historyButtons"></div>
</div>
<div id="mainPanel">
<div id="editorContainer">
<div id="rightPanel">
<div id="preview"></div>
<textarea id="luaOutput" placeholder="Lua code will appear here..."></textarea>
<button onclick="generateLua()">Update Preview</button>
<button onclick="saveToHistory()">Save Script</button>
<button onclick="downloadRBXM()">Download .rbxm</button>
<button onclick="copyLua()">Copy Lua to Clipboard</button>
<button onclick="addDemoElement()">Add GUI Element</button>
</div>
</div>
</div>

<div id="scriptModal">
<button class="closeModal" onclick="closeScriptModal()">X</button>
<button class="saveModal" onclick="saveScriptFromModal()">Save Script</button>
<textarea id="scriptEditor"></textarea>
</div>

<div id="colorModal">
<label>Pick Color:</label>
<input type="color" id="colorPicker">
<button onclick="closeColorModal()">X</button>
</div>

<div id="propertyModal">
<h3>Edit Properties</h3>
<label>Text:</label><input type="text" id="propText">
<label>TextSize:</label><input type="number" id="propTextSize">
<label>Font:</label>
<select id="propFont">
<option value="Arial">Arial</option>
<option value="Gotham">Gotham</option>
<option value="SourceSans">SourceSans</option>
<option value="Cartoon">Cartoon</option>
</select>
<label>TextWrapped:</label><select id="propWrapped"><option value="true">true</option><option value="false">false</option></select>
<label>TextScaled:</label><select id="propScaled"><option value="true">true</option><option value="false">false</option></select>
<label>UICorner Radius:</label><input type="number" id="propCorner">
<label>UIPadding Left:</label><input type="number" id="propPaddingL">
<label>UIPadding Top:</label><input type="number" id="propPaddingT">
<label>Image Asset ID:</label><input type="text" id="propImage">
<button onclick="saveProperties()">Save Properties</button>
<button onclick="closePropertyModal()">Close</button>
</div>

<script>
let guiElements=[];let gridSize=10;

function addDemoElement(){const type=prompt("Enter element type (Frame,TextLabel,TextButton,TextBox,ImageLabel,ImageButton,ScrollingFrame,ViewportFrame)","Frame");if(type) addGuiElement(type);}

function addGuiElement(type){
const preview=document.getElementById('preview');
const div=document.createElement('div');
div.className='gui-element';
div.innerText=type;
div.style.left='10px';div.style.top='10px';div.style.width='100px';div.style.height='30px';
div.style.background='#333';div.style.color='#fff';
div.dataset.index=guiElements.length;
div.dataset.type=type;
const resize=document.createElement('div');resize.className='resize-handle';div.appendChild(resize);
let resizing=false,resStartX,resStartY,resStartW,resStartH;
function startResize(e){e.preventDefault();resizing=true;resStartX=(e.touches?e.touches[0].clientX:e.clientX);resStartY=(e.touches?e.touches[0].clientY:e.clientY);resStartW=parseInt(div.style.width);resStartH=parseInt(div.style.height);}
resize.addEventListener('mousedown',startResize);resize.addEventListener('touchstart',startResize);
function doResize(e){if(resizing){const clientX=(e.touches?e.touches[0].clientX:e.clientX);const clientY=(e.touches?e.touches[0].clientY:e.clientY);let w=resStartW+(clientX-resStartX);let h=resStartH+(clientY-resStartY);w=Math.round(w/gridSize)*gridSize;h=Math.round(h/gridSize)*gridSize;div.style.width=w+'px';div.style.height=h+'px';guiElements[div.dataset.index].width=w;guiElements[div.dataset.index].height=h;}}
function endResize(){resizing=false;}
document.addEventListener('mousemove',doResize);document.addEventListener('mouseup',endResize);
document.addEventListener('touchmove',doResize);document.addEventListener('touchend',endResize);

let dragging=false,offsetX,offsetY;
function startDrag(e){e.preventDefault();dragging=true;const clientX=(e.touches?e.touches[0].clientX:e.clientX);const clientY=(e.touches?e.touches[0].clientY:e.clientY);offsetX=clientX-div.offsetLeft;offsetY=clientY-div.offsetTop;}
function doDrag(e){if(dragging&&!resizing){const clientX=(e.touches?e.touches[0].clientX:e.clientX);const clientY=(e.touches?e.touches[0].clientY:e.clientY);let x=Math.round((clientX-offsetX)/gridSize)*gridSize;let y=Math.round((clientY-offsetY)/gridSize)*gridSize;div.style.left=x+'px';div.style.top=y+'px';guiElements[div.dataset.index].x=x;guiElements[div.dataset.index].y=y;}}
function endDrag(){dragging=false;}
div.addEventListener('mousedown',startDrag);div.addEventListener('touchstart',startDrag);
document.addEventListener('mousemove',doDrag);document.addEventListener('touchmove',doDrag);
document.addEventListener('mouseup',endDrag);document.addEventListener('touchend',endDrag);

div.addEventListener('dblclick',()=>openColorModal(div.dataset.index));
div.addEventListener('touchend',(e)=>{if(e.detail===2) openColorModal(div.dataset.index);});
div.addEventListener('contextmenu',(e)=>{e.preventDefault();openPropertyModal(div.dataset.index);});

preview.appendChild(div);
guiElements.push({el:div,type:type,x:10,y:10,width:100,height:30,bgColor:'#333',textColor:'#fff',script:'',text:'',textSize:14,font:'Arial',textWrapped:true,textScaled:false,corner:0,paddingL:0,paddingT:0,image:''});
}

// ---------- Color Modal ----------
let currentColorIndex=null;
function openColorModal(index){currentColorIndex=index;document.getElementById('colorModal').style.display='flex';document.getElementById('colorPicker').value=guiElements[index].bgColor;}
function closeColorModal(){const color=document.getElementById('colorPicker').value;guiElements[currentColorIndex].bgColor=color;guiElements[currentColorIndex].el.style.background=color;document.getElementById('colorModal').style.display='none';}

// ---------- Script Modal ----------
let currentScriptIndex=null;
function openScriptModal(index){currentScriptIndex=index;document.getElementById('scriptModal').style.display='block';document.getElementById('scriptEditor').value=guiElements[index].script;}
function closeScriptModal(){document.getElementById('scriptModal').style.display='none';}
function saveScriptFromModal(){guiElements[currentScriptIndex].script=document.getElementById('scriptEditor').value;closeScriptModal();}

// ---------- Property Modal ----------
let currentPropIndex=null;
function openPropertyModal(index){
currentPropIndex=index;
const g=guiElements[index];
document.getElementById('propText').value=g.text||'';
document.getElementById('propTextSize').value=g.textSize||14;
document.getElementById('propFont').value=g.font||'Arial';
document.getElementById('propWrapped').value=g.textWrapped?'true':'false';
document.getElementById('propScaled').value=g.textScaled?'true':'false';
document.getElementById('propCorner').value=g.corner||0;
document.getElementById('propPaddingL').value=g.paddingL||0;
document.getElementById('propPaddingT').value=g.paddingT||0;
document.getElementById('propImage').value=g.image||'';
document.getElementById('propertyModal').style.display='flex';
}
function closePropertyModal(){document.getElementById('propertyModal').style.display='none';}
function saveProperties(){
const g=guiElements[currentPropIndex];
g.text=document.getElementById('propText').value;
g.textSize=parseInt(document.getElementById('propTextSize').value);
g.font=document.getElementById('propFont').value;
g.textWrapped=document.getElementById('propWrapped').value==='true';
g.textScaled=document.getElementById('propScaled').value==='true';
g.corner=parseInt(document.getElementById('propCorner').value);
g.paddingL=parseInt(document.getElementById('propPaddingL').value);
g.paddingT=parseInt(document.getElementById('propPaddingT').value);
g.image=document.getElementById('propImage').value;
g.el.innerText=g.text;
document.getElementById('propertyModal').style.display='none';
}

// ---------- Lua Generation ----------
function generateLua(){
let lua='';
guiElements.forEach(g=>{
lua+=`local ${g.type}_obj = Instance.new("${g.type}")\n`;
lua+=`${g.type}_obj.Position = UDim2.new(0,${g.x},0,${g.y})\n`;
lua+=`${g.type}_obj.Size = UDim2.new(0,${g.width},0,${g.height})\n`;
lua+=`${g.type}_obj.BackgroundColor3 = Color3.fromRGB(${parseInt(g.bgColor.slice(1,3),16)},${parseInt(g.bgColor.slice(3,5),16)},${parseInt(g.bgColor.slice(5,7),16)})\n`;
if(g.type.includes('Text')) lua+=`${g.type}_obj.Text = "${g.text}"\n${g.type}_obj.TextSize = ${g.textSize}\n${g.type}_obj.Font = Enum.Font.${g.font}\n${g.type}_obj.TextWrapped = ${g.textWrapped}\n${g.type}_obj.TextScaled = ${g.textScaled}\n`;
if(g.corner) lua+=`-- UICorner radius: ${g.corner}\n`;
if(g.paddingL||g.paddingT) lua+=`-- Padding: L${g.paddingL}, T${g.paddingT}\n`;
if(g.image) lua+=`${g.type}_obj.Image = "rbxassetid://${g.image}"\n`;
if(g.script) lua+=`-- Script\n${g.script}\n`;
});
document.getElementById('luaOutput').value=lua;
}

// ---------- Copy Lua ----------
function copyLua(){document.getElementById('luaOutput').select();document.execCommand('copy');alert('Lua copied!');}

// ---------- History ----------
function saveToHistory(){const code=document.getElementById('luaOutput').value;let history=JSON.parse(localStorage.getItem('guiHistory')||'[]');history.unshift(code);if(history.length>20) history.pop();localStorage.setItem('guiHistory',JSON.stringify(history));renderHistory();}
function renderHistory(){const container=document.getElementById('historyButtons');container.innerHTML='';const history=JSON.parse(localStorage.getItem('guiHistory')||'[]');history.forEach((code,i)=>{const btn=document.createElement('button');btn.innerText='History '+(i+1);btn.onclick=()=>{document.getElementById('luaOutput').value=code;};container.appendChild(btn);});}
renderHistory();

// ---------- Download .rbxm ----------
function downloadRBXM(){let rbxm='<roblox><Item class="ScreenGui">';guiElements.forEach(g=>{rbxm+=`<Item class="${g.type}"><Properties><Property name="Position" type="Vector2"><X>${g.x}</X><Y>${g.y}</Y></Property><Property name="Size" type="Vector2"><X>${g.width}</X><Y>${g.height}</Y></Property><Property name="BackgroundColor3" type="Color3"><R>${parseInt(g.bgColor.slice(1,3),16)}</R><G>${parseInt(g.bgColor.slice(3,5),16)}</G><B>${parseInt(g.bgColor.slice(5,7),16)}</B></Property><Property name="Text" type="string">${g.text}</Property><Property name="TextSize" type="number">${g.textSize}</Property><Property name="Font" type="string">${g.font}</Property><Property name="TextWrapped" type="boolean">${g.textWrapped}</Property><Property name="TextScaled" type="boolean">${g.textScaled}</Property><Property name="UICorner" type="number">${g.corner}</Property><Property name="PaddingL" type="number">${g.paddingL}</Property><Property name="PaddingT" type="number">${g.paddingT}</Property><Property name="Image" type="string">${g.image}</Property><Property name="Script" type="string">${g.script}</Property></Properties></Item>`;});rbxm+='</Item></roblox>';const blob=new Blob([rbxm],{type:'application/octet-stream'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='MyGui.rbxm';link.click();}

// ---------- Auto-load last ----------
window.onload=()=>{const last=JSON.parse(localStorage.getItem('guiHistory')||'[]')[0];if(last){document.getElementById('luaOutput').value=last;}}
</script>
</body>
</html>
