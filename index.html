<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>istg if this shih dont work</title>
<style>
body, html{margin:0;padding:0;height:100%;font-family:Arial,sans-serif;background:#1e1e1e;color:#fff;overflow:hidden;}
/* Top bar */
#topBar{height:50px;background:#333;display:flex;align-items:center;padding:0 10px;justify-content:space-between;}
#topBar button{background:#555;border:none;color:#fff;padding:5px 10px;margin-left:5px;cursor:pointer;}
#topBar input{padding:5px;flex:1;margin-left:10px;background:#222;border:1px solid #444;color:#fff;}
#editorContainer{display:flex;height:calc(100% - 50px);}
/* Left panel toolbox */
#leftPanel{width:250px;background:#2c2c2c;padding:10px;overflow-y:auto;display:flex;flex-direction:column;}
#leftPanel h3{margin-top:0;}
#leftPanel button{margin-bottom:5px;padding:10px;background:#444;border:none;color:#fff;cursor:pointer;}
#leftPanel button:hover{background:#555;}
/* Stage / preview */
#stage{flex:1;background:#111;position:relative;overflow:hidden;border-left:2px solid #222;border-right:2px solid #222;}
.gui-element{position:absolute;border:1px solid #888;padding:5px;cursor:move;background:#333;color:#fff;text-align:center;user-select:none;touch-action:none;}
.resize-handle{width:15px;height:15px;background:red;position:absolute;bottom:0;right:0;cursor:se-resize;z-index:10;touch-action:none;}
/* Bottom Lua output */
#bottomPanel{height:150px;background:#222;display:flex;flex-direction:column;padding:5px;}
#luaOutput{flex:1;background:#111;color:#0f0;font-family:monospace;padding:5px;resize:none;overflow:auto;}
/* Modals */
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:1000;color:#fff;display:flex;justify-content:center;align-items:center;flex-direction:column;}
.modal textarea{width:90%;height:70%;background:#222;color:#0f0;font-family:monospace;padding:10px;}
.modal input[type=color]{width:200px;height:50px;}
.modal button{margin-top:10px;padding:10px;background:red;border:none;color:#fff;cursor:pointer;}
#propertyModal input, #propertyModal select{margin-top:5px;width:200px;}
#propertyModal label{margin-top:5px;}
</style>
</head>
<body>
<div id="topBar">
<input type="text" id="projectName" placeholder="Project Name">
<div>
<button onclick="saveToHistory()">Save</button>
<button onclick="generateLua()">Update Lua</button>
<button onclick="downloadRBXM()">Download .rbxm</button>
<button onclick="copyLua()">Copy Lua</button>
</div>
</div>
<div id="editorContainer">
<div id="leftPanel">
<h3>Toolbox</h3>
<button onclick="addGuiElement('Frame')">Frame</button>
<button onclick="addGuiElement('TextLabel')">TextLabel</button>
<button onclick="addGuiElement('TextButton')">TextButton</button>
<button onclick="addGuiElement('TextBox')">TextBox</button>
<button onclick="addGuiElement('ImageLabel')">ImageLabel</button>
<button onclick="addGuiElement('ImageButton')">ImageButton</button>
<button onclick="addGuiElement('ScrollingFrame')">ScrollingFrame</button>
<button onclick="addGuiElement('ViewportFrame')">ViewportFrame</button>
</div>
<div id="stage"></div>
</div>
<div id="bottomPanel">
<textarea id="luaOutput" placeholder="Lua code will appear here..."></textarea>
</div>

<!-- Script Modal -->
<div id="scriptModal" class="modal">
<textarea id="scriptEditor"></textarea>
<button onclick="saveScriptFromModal()">Save Script</button>
<button onclick="closeScriptModal()">X</button>
</div>

<!-- Color Modal -->
<div id="colorModal" class="modal">
<label>Pick Color:</label>
<input type="color" id="colorPicker">
<button onclick="closeColorModal()">X</button>
</div>

<!-- Property Modal -->
<div id="propertyModal" class="modal">
<h3>Edit Properties</h3>
<label>Text:</label><input type="text" id="propText">
<label>TextSize:</label><input type="number" id="propTextSize">
<label>Font:</label>
<select id="propFont">
<option value="Arial">Arial</option>
<option value="Gotham">Gotham</option>
<option value="SourceSans">SourceSans</option>
<option value="Cartoon">Cartoon</option>
</select>
<label>TextWrapped:</label><select id="propWrapped"><option value="true">true</option><option value="false">false</option></select>
<label>TextScaled:</label><select id="propScaled"><option value="true">true</option><option value="false">false</option></select>
<label>UICorner Radius:</label><input type="number" id="propCorner">
<label>UIPadding Left:</label><input type="number" id="propPaddingL">
<label>UIPadding Top:</label><input type="number" id="propPaddingT">
<label>Image Asset ID:</label><input type="text" id="propImage">
<button onclick="saveProperties()">Save Properties</button>
<button onclick="closePropertyModal()">Close</button>
</div>

<script>
let guiElements=[];let gridSize=10;

function addGuiElement(type){
const stage=document.getElementById('stage');
const div=document.createElement('div');
div.className='gui-element';div.innerText=type;
div.style.left='10px';div.style.top='10px';div.style.width='100px';div.style.height='30px';
div.dataset.index=guiElements.length;div.dataset.type=type;
const resize=document.createElement('div');resize.className='resize-handle';div.appendChild(resize);
stage.appendChild(div);
let dragging=false,resizing=false,offsetX,offsetY,resStartX,resStartY,resStartW,resStartH;
function startDrag(e){e.preventDefault();dragging=true;const clientX=e.touches?e.touches[0].clientX:e.clientX;const clientY=e.touches?e.touches[0].clientY:e.clientY;offsetX=clientX-div.offsetLeft;offsetY=clientY-div.offsetTop;}
function doDrag(e){if(dragging&&!resizing){const clientX=e.touches?e.touches[0].clientX:e.clientX;const clientY=e.touches?e.touches[0].clientY:e.clientY;let x=Math.round((clientX-offsetX)/gridSize)*gridSize;let y=Math.round((clientY-offsetY)/gridSize)*gridSize;div.style.left=x+'px';div.style.top=y+'px';guiElements[div.dataset.index].x=x;guiElements[div.dataset.index].y=y;}}
function endDrag(){dragging=false;}
div.addEventListener('mousedown',startDrag);div.addEventListener('touchstart',startDrag);
document.addEventListener('mousemove',doDrag);document.addEventListener('touchmove',doDrag);
document.addEventListener('mouseup',endDrag);document.addEventListener('touchend',endDrag);

function startResize(e){e.preventDefault();resizing=true;resStartX=e.touches?e.touches[0].clientX:e.clientX;resStartY=e.touches?e.touches[0].clientY:e.clientY;resStartW=parseInt(div.style.width);resStartH=parseInt(div.style.height);}
function doResize(e){if(resizing){const clientX=e.touches?e.touches[0].clientX:e.clientX;const clientY=e.touches?e.touches[0].clientY:e.clientY;let w=resStartW+(clientX-resStartX);let h=resStartH+(clientY-resStartY);w=Math.round(w/gridSize)*gridSize;h=Math.round(h/gridSize)*gridSize;div.style.width=w+'px';div.style.height=h+'px';guiElements[div.dataset.index].width=w;guiElements[div.dataset.index].height=h;}}
function endResize(){resizing=false;}
resize.addEventListener('mousedown',startResize);resize.addEventListener('touchstart',startResize);
document.addEventListener('mousemove',doResize);document.addEventListener('touchmove',doResize);
document.addEventListener('mouseup',endResize);document.addEventListener('touchend',endResize);

div.addEventListener('dblclick',()=>openColorModal(div.dataset.index));
div.addEventListener('contextmenu',(e)=>{e.preventDefault();openPropertyModal(div.dataset.index);});

guiElements.push({el:div,type:type,x:10,y:10,width:100,height:30,bgColor:'#333',textColor:'#fff',script:'',text:'',textSize:14,font:'Arial',textWrapped:true,textScaled:false,corner:0,paddingL:0,paddingT:0,image:''});
}

// ---------- Modals ----------
let currentIndex=null;
function openScriptModal(index){currentIndex=index;document.getElementById('scriptModal').style.display='flex';document.getElementById('scriptEditor').value=guiElements[index].script;}
function closeScriptModal(){document.getElementById('scriptModal').style.display='none';}
function saveScriptFromModal(){guiElements[currentIndex].script=document.getElementById('scriptEditor').value;closeScriptModal();}

function openColorModal(index){currentIndex=index;document.getElementById('colorModal').style.display='flex';document.getElementById('colorPicker').value=guiElements[index].bgColor;}
function closeColorModal(){const color=document.getElementById('colorPicker').value;guiElements[currentIndex].bgColor=color;guiElements[currentIndex].el.style.background=color;document.getElementById('colorModal').style.display='none';}

function openPropertyModal(index){currentIndex=index;const g=guiElements[index];
document.getElementById('propText').value=g.text;document.getElementById('propTextSize').value=g.textSize;document.getElementById('propFont').value=g.font;
document.getElementById('propWrapped').value=g.textWrapped?'true':'false';document.getElementById('propScaled').value=g.textScaled?'true':'false';
document.getElementById('propCorner').value=g.corner;document.getElementById('propPaddingL').value=g.paddingL;document.getElementById('propPaddingT').value=g.paddingT;
document.getElementById('propImage').value=g.image;
document.getElementById('propertyModal').style.display='flex';}
function closePropertyModal(){document.getElementById('propertyModal').style.display='none';}
function saveProperties(){const g=guiElements[currentIndex];
g.text=document.getElementById('propText').value;g.textSize=parseInt(document.getElementById('propTextSize').value);g.font=document.getElementById('propFont').value;
g.textWrapped=document.getElementById('propWrapped').value==='true';g.textScaled=document.getElementById('propScaled').value==='true';
g.corner=parseInt(document.getElementById('propCorner').value);g.paddingL=parseInt(document.getElementById('propPaddingL').value);
g.paddingT=parseInt(document.getElementById('propPaddingT').value);g.image=document.getElementById('propImage').value;
g.el.innerText=g.text;closePropertyModal();}

// ---------- Lua Generation ----------
function generateLua(){let lua='';guiElements.forEach(g=>{lua+=`local ${g.type}_obj = Instance.new("${g.type}")\n`;lua+=`${g.type}_obj.Position = UDim2.new(0,${g.x},0,${g.y})\n`;lua+=`${g.type}_obj.Size = UDim2.new(0,${g.width},0,${g.height})\n`;lua+=`${g.type}_obj.BackgroundColor3 = Color3.fromRGB(${parseInt(g.bgColor.slice(1,3),16)},${parseInt(g.bgColor.slice(3,5),16)},${parseInt(g.bgColor.slice(5,7),16)})\n`;
if(g.type.includes('Text')) lua+=`${g.type}_obj.Text = "${g.text}"\n${g.type}_obj.TextSize = ${g.textSize}\n${g.type}_obj.Font = Enum.Font.${g.font}\n${g.type}_obj.TextWrapped = ${g.textWrapped}\n${g.type}_obj.TextScaled = ${g.textScaled}\n`;
if(g.image) lua+=`${g.type}_obj.Image = "rbxassetid://${g.image}"\n`;if(g.script) lua+=`${g.script}\n`;});document.getElementById('luaOutput').value=lua;}
function copyLua(){document.getElementById('luaOutput').select();document.execCommand('copy');alert('Lua copied!');}
function saveToHistory(){const code=document.getElementById('luaOutput').value;let history=JSON.parse(localStorage.getItem('guiHistory')||'[]');history.unshift(code);if(history.length>20) history.pop();localStorage.setItem('guiHistory',JSON.stringify(history));}
function downloadRBXM(){alert('RBXM export placeholder (add full serialization logic)');}
</script>
</body>
</html>
